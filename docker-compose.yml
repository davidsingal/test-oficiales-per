# Local development stack: Postgres + Next.js/Payload dev server.
#
#   docker compose up --build              # app on http://localhost:3000 (admin at /admin)
#   docker compose down -v                 # stop and wipe the local database
#
# Data pipeline (profile "pipeline", nothing installed on the host):
#
#   scripts/data-sync.sh [--apply]                  # all steps below (see pipeline/README.md)
#   docker compose run --rm pipeline discover --write   # new sessions on the ministry CDN -> sources.json
#   docker compose run --rm pipeline extract        # originals (cached in data/cache) -> data/outputs/exams.json
#   docker compose run --rm ingest dry-run          # preview DB changes (`ingest` applies, `prune` deletes)
#
# Note: @payloadcms/db-vercel-postgres only uses the plain `pg` driver when the
# DATABASE_URL host is `localhost`/`127.0.0.1`; any other host goes through the
# Vercel/Neon driver, which can't talk to a regular Postgres. So the app shares
# the db container's network namespace and reaches Postgres on localhost:5432.
# Because of that, the app's port 3000 is published on the `db` service.

x-node-app: &node-app
  build: .
  network_mode: "service:db"
  depends_on:
    db:
      condition: service_healthy
  environment:
    # These take precedence over any .env file Next or dotenv would load.
    DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_per
    PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-dev-secret-change-me}
    NODE_ENV: development
    WATCHPACK_POLLING: "true"
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - next_cache:/app/.next

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_per
    ports:
      - "${DB_PORT:-5432}:5432"
      - "${APP_PORT:-3000}:3000"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_per"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *node-app

  # Python + pdfplumber: discover/download the official PDFs and parse them
  # into data/outputs/exams.json. Subcommand as argument (default: extract).
  pipeline:
    profiles: ["pipeline"]
    build: ./pipeline
    command: ["extract"]
    volumes:
      - ./data:/data              # cache/ (original PDFs, gitignored) and outputs/
      - ./pipeline:/pipeline      # code and sources.json

  # Upserts data/outputs/exams.json into Postgres through the Payload local API.
  ingest:
    <<: *node-app
    profiles: ["pipeline"]
    entrypoint: ["pnpm", "data:ingest"]
    command: []

  # End-to-end tests (Playwright) against the running app (`docker compose up` first):
  #   docker compose run --rm e2e                 # all specs
  #   docker compose run --rm e2e e2e/quiz.spec.ts
  # Shares the db network namespace, so the app is on localhost:3000.
  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: e2e/Dockerfile
    network_mode: "service:db"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules

volumes:
  pgdata:
  node_modules:
  next_cache:
  e2e_node_modules:
